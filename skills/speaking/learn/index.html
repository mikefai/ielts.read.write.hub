<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speaking study notes · IELTS Study Hub</title>
<link rel="stylesheet" href="../../../assets/core/tokens.css"><link rel="stylesheet" href="../../../assets/core/base.css"><link rel="stylesheet" href="../../../assets/hub.css"><link rel="stylesheet" href="../../../assets/core/learn.css"></head>
<body><div class="wrap" style="--c:#c78a00"><p><a class="back" href="../index.html">&larr; Speaking</a></p>
<header class="mast rise"><p class="kicker">Speaking &middot; Study notes</p><h1>Learn how to <em>speak.</em></h1>
<p>Pick a part of the interview. Each note shows the steps, the tricks and the traps, with an example.</p></header>
<main id="notes" class="rise"><p>Loading notes...</p></main></div>
<script type="module">
import { mountDisplayMenu } from '../../../assets/core/display.js';
import { mountLearn } from '../../../assets/core/learn.js';
mountDisplayMenu(document.querySelector('.wrap > p'));
const mount = document.getElementById('notes');
try {
  const notes = await (await fetch('../../../content/learn/speaking.json')).json();
  mountLearn({ mount, notes, groups: [
    { title: 'Start here', ids: ['start-here'] },
    { title: 'The three parts', ids: ['part1', 'part2', 'part3'] }] });
} catch (e) { mount.innerHTML = '<p class="card">Could not load the notes. Serve the folder over http, e.g. <code>npx serve .</code></p>'; }
</script></body></html>
