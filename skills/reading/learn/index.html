<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reading study notes · IELTS Study Hub</title>
<link rel="stylesheet" href="../../../assets/core/tokens.css"><link rel="stylesheet" href="../../../assets/core/base.css"><link rel="stylesheet" href="../../../assets/hub.css"><link rel="stylesheet" href="../../../assets/core/learn.css"></head>
<body><div class="wrap" style="--c:#d9441e"><p><a class="back" href="../index.html">&larr; Reading</a></p>
<header class="mast rise"><p class="kicker">Reading &middot; Study notes</p><h1>Learn how to <em>answer.</em></h1>
<p>Pick a question type. Each note shows the steps, the tricks and the traps, with an example.</p></header>
<main id="notes" class="rise"><p>Loading notes...</p></main></div>
<script type="module">
import { mountDisplayMenu } from '../../../assets/core/display.js';
import { mountLearn } from '../../../assets/core/learn.js';
mountDisplayMenu(document.querySelector('.wrap > p'));
const mount = document.getElementById('notes');
try {
  const notes = await (await fetch('../../../content/learn/reading.json')).json();
  mountLearn({ mount, notes, groups: [
    { title: 'Start here', ids: ['start-here'] },
    { title: 'Is the statement true? (Yes/No, True/False)', ids: ['tfng', 'ynng'] },
    { title: 'Choosing and short answers', ids: ['mcq', 'short-answer'] },
    { title: 'Filling gaps', ids: ['sentence-completion', 'summary-completion', 'summary-wordbank', 'notes-completion', 'diagram-labelling'] },
    { title: 'Matching', ids: ['matching-headings', 'matching-information', 'matching-features', 'matching-endings'] }] });
} catch (e) { mount.innerHTML = '<p class="card">Could not load the notes. Serve the folder over http, e.g. <code>npx serve .</code></p>'; }
</script></body></html>
